<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bag Sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e574e; --ink-2:#0b4840; --gold:#c9a227; --gold-soft:#f4ead0;
    --paper:#f6f4ef; --card:#ffffff; --line:#e4e0d6; --muted:#6b6b6b; --text:#1d1d1f;
    --ok:#2f7d4f; --ok-soft:#e5f2ea; --run:#a86a10; --run-soft:#fbf0dc;
    --bad:#b42318; --bad-soft:#fbe9e7; --off:#6b7280; --off-soft:#eef0f2;
    --radius:12px; --shadow:0 1px 2px rgba(14,87,78,.06),0 8px 24px rgba(14,87,78,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--text);font:15px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--ink);margin:0;letter-spacing:-.01em}
  a{color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .topbar .wrap{display:flex;align-items:center;gap:14px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:18px;font-weight:600;letter-spacing:.01em}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:var(--ink)}
  .brand-mark svg{width:18px;height:18px}
  .topbar .spacer{flex:1}
  .topbar .who{font-size:13px;opacity:.8}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;background:none}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:var(--gold);color:var(--ink)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ink{background:var(--ink);color:#fff}
  .btn-ink:hover{background:var(--ink-2)}
  .btn-ghost{border-color:var(--line);background:#fff;color:var(--ink)}
  .btn-ghost:hover{border-color:#cfc9bb}
  .btn-ghost-dark{border-color:rgba(255,255,255,.25);color:#fff}
  .btn-ghost-dark:hover{background:rgba(255,255,255,.08)}
  .btn-danger{color:var(--bad);border-color:#efc9c4;background:#fff}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn-block{width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:0 0 6px}
  .in{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;outline:none;transition:.15s}
  .in:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(14,87,78,.08)}
  textarea.in{resize:vertical;min-height:78px}
  .field{margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .st-run{color:var(--run);background:var(--run-soft)}
  .st-ok{color:var(--ok);background:var(--ok-soft)}
  .st-bad{color:var(--bad);background:var(--bad-soft)}
  .st-off{color:var(--off);background:var(--off-soft)}
  .center-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login{width:100%;max-width:400px;padding:34px}
  .login .brand{color:var(--ink);margin-bottom:22px}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
  .btn .spinner{width:16px;height:16px;border-width:2px;border-color:rgba(0,0,0,.15);border-top-color:currentColor}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--muted)}
  /* dashboard */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:30px 0 20px;flex-wrap:wrap}
  .page-head h1{font-size:30px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{padding:16px 18px}
  .stat .n{font-family:Fraunces,serif;font-size:30px;font-weight:600;color:var(--ink);line-height:1.1}
  .stat .l{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .stat.active{outline:2px solid var(--ink)}
  .stat{cursor:pointer;text-align:left}
  .toolbar{display:flex;gap:10px;margin-bottom:12px}
  .toolbar .in{max-width:360px}
  .list{overflow:hidden}
  .row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.3fr) 150px 130px;gap:16px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
  .row:last-child{border-bottom:0}
  .row:hover{background:#fbfaf7}
  .row .t{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:12.5px;color:var(--muted)}
  .dots{display:flex;flex-wrap:wrap;gap:4px}
  .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .dot.assinado{background:var(--ok-soft);color:var(--ok)}
  .dot.pendente{background:#f3f1ec;color:#8a8577}
  .dot.recusado{background:var(--bad-soft);color:var(--bad)}
  .prog{height:6px;border-radius:9px;background:#efece5;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--ok);border-radius:9px}
  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .empty h3{margin-bottom:6px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(14,22,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .15s}
  @keyframes fade{from{opacity:0}}
  .modal{width:100%;max-width:560px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
  .modal.wide{max-width:860px}
  @keyframes pop{from{transform:translateY(8px);opacity:0}}
  .modal-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  .modal-h h2{font-size:21px;flex:1;min-width:0}
  .modal-b{padding:22px 24px}
  .modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fbfaf7;border-radius:0 0 16px 16px;flex-wrap:wrap}
  .x{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}
  .x:hover{background:#f3f1ec}
  .x svg{width:20px;height:20px;display:block}
  .drop{border:2px dashed #d6d0c2;border-radius:12px;padding:26px;text-align:center;cursor:pointer;background:#fcfbf8;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--ink);background:#f7f5f0}
  .drop svg{width:34px;height:34px;color:var(--ink)}
  .file-chip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fcfbf8}
  .file-chip svg{width:26px;height:26px;color:var(--bad);flex:none}
  .signer-row{display:grid;grid-template-columns:28px 1.3fr 1.4fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
  .icon-btns{display:flex;gap:2px}
  .ib{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .ib:hover{color:var(--ink);border-color:#cfc9bb}
  .ib svg{width:15px;height:15px}
  .switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch .tr{width:40px;height:23px;border-radius:99px;background:#d9d4c8;position:relative;transition:.15s;flex:none}
  .switch .tr::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked+.tr{background:var(--ink)}
  .switch input:checked+.tr::after{left:20px}
  .section-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gold);margin:22px 0 10px}
  .section-t:first-child{margin-top:0}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:14px}
  .kv dt{color:var(--muted);font-weight:600}
  .kv dd{margin:0;min-width:0}
  .srow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .info{flex:1;min-width:0}
  .srow .nm{font-weight:700;color:var(--ink)}
  .srow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .timeline{position:relative;padding-left:20px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .ev{position:relative;padding:0 0 12px}
  .ev::before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
  .ev.assinou::before,.ev.concluido::before{border-color:var(--ok);background:var(--ok)}
  .ev.recusou::before,.ev.cancelado::before,.ev.expirado::before{border-color:var(--bad);background:var(--bad)}
  .ev .d{font-size:12px;color:var(--muted)}
  .ev .tx{font-size:13.5px}
  .toast-box{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s;max-width:90vw}
  .toast.err{background:var(--bad)}
  .alert{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
  .alert svg{width:19px;height:19px;flex:none;margin-top:1px}
  .alert.info{background:#eef2f9;color:var(--ink)}
  .alert.ok{background:var(--ok-soft);color:#1f5a37}
  .alert.warn{background:var(--run-soft);color:#7a4c08}
  .alert.bad{background:var(--bad-soft);color:#8c1c13}
  /* signer */
  .doc-layout{display:grid;grid-template-columns:330px 1fr;gap:22px;margin:26px auto 120px;align-items:start}
  .side{position:sticky;top:84px;padding:22px}
  .side h1{font-size:23px;line-height:1.25;margin-bottom:6px;word-break:break-word}
  .msg{background:var(--gold-soft);border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:14px;white-space:pre-wrap;margin:14px 0}
  .plist{list-style:none;padding:0;margin:0}
  .plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .plist li:last-child{border-bottom:0}
  .plist .st{margin-left:auto}
  .integrity{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ok);margin-top:14px}
  .integrity svg{width:16px;height:16px;flex:none}
  .viewer{display:flex;flex-direction:column;gap:14px}
  .pg{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 20px rgba(14,87,78,.07);border-radius:4px;position:relative;overflow:hidden}
  .pg canvas{display:block;width:100%;height:auto}
  .pg .pn{position:absolute;right:8px;bottom:6px;font-size:11px;color:#999;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:5px}
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(14,87,78,.08);z-index:30;padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
  .actionbar .wrap{display:flex;align-items:center;gap:12px}
  .actionbar .tx{flex:1;font-size:14px;min-width:0}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps i{flex:1;height:4px;border-radius:9px;background:#ebe7de}
  .steps i.on{background:var(--ink)}
  .code-in{font-size:28px;letter-spacing:12px;text-align:center;font-weight:700;padding:12px}
  .tabs{display:flex;background:#f3f1ec;border-radius:10px;padding:4px;margin-bottom:12px}
  .tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .pad{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
  .pad canvas{display:block;width:100%;height:190px;cursor:crosshair}
  .pad .base{position:absolute;left:24px;right:24px;bottom:42px;border-bottom:1px dashed #cfc9bb;pointer-events:none}
  .pad .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#aaa;pointer-events:none}
  .pad .clr{position:absolute;top:8px;right:8px}
  .typed{height:150px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:46px;color:#1b2a59;background:#fff;overflow:hidden;padding:0 16px;text-align:center;line-height:1.1}
  .fonts{display:flex;gap:8px;margin-top:8px}
  .fonts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;cursor:pointer;font-size:20px;color:#1b2a59}
  .fonts button.on{border-color:var(--ink);box-shadow:0 0 0 2px rgba(14,87,78,.12)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:16px;cursor:pointer}
  .check input{margin-top:3px;width:17px;height:17px;accent-color:var(--ink);flex:none}
  .done-ic{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:4px auto 16px}
  .done-ic svg{width:36px;height:36px}
  .verify-box{max-width:760px;margin:36px auto 80px}
  .verify-box h1{font-size:30px;margin-bottom:6px}
  .footer-note{text-align:center;font-size:12px;color:var(--muted);padding:30px 0}
  @media (max-width:860px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .row{grid-template-columns:1fr auto;gap:8px}
    .row .c-dots,.row .c-prog{display:none}
    .doc-layout{grid-template-columns:1fr;margin-top:14px}
    .side{position:static}
    .signer-row{grid-template-columns:28px 1fr 1fr;}
    .signer-row .icon-btns{grid-column:2/4;justify-content:flex-end}
    .kv{grid-template-columns:1fr}
    .kv dt{margin-top:6px}
    .grid2{grid-template-columns:1fr}
    .topbar .who{display:none}
    .page-head h1{font-size:25px}
  }

  /* ---------- v2 ---------- */
  .form-page{max-width:880px;margin:0 auto;padding:26px 20px 130px}
  .form-page h1{font-size:28px;margin-bottom:4px}
  .fsec{padding:22px 24px;margin-top:16px}
  .fsec>h2{font-size:19px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fsec>h2 .opt{font-family:Manrope,sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
  .fsec .lead{font-size:13px;color:var(--muted);margin:0 0 14px}
  .req{color:var(--bad)}
  .doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfbf8;margin-bottom:8px}
  .doc-row .ic{width:34px;height:34px;border-radius:8px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;flex:none;font-size:10px;font-weight:800}
  .doc-row .ic.cv{background:#eef2f9;color:var(--ink)}
  .doc-row input.in{padding:7px 10px}
  .doc-row .meta{font-size:12px;color:var(--muted);white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f3f1ec;color:var(--ink);border:1px solid var(--line)}
  .chip.gold{background:var(--gold-soft);border-color:#ead9a6}
  .chip button{border:0;background:none;cursor:pointer;padding:0;color:var(--muted);display:flex}
  .chip button svg{width:13px;height:13px}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .btn-out{border:1px solid #e8c9b0;color:#a34d12;background:#fff}
  .btn-out:hover{background:#fff7f1}
  .btn-out.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .scard{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
  .scard .body{flex:1;min-width:0}
  .scard .nm{font-weight:700;color:var(--ink)}
  .scard .sub{font-size:12.5px;color:var(--muted);margin:2px 0 8px;word-break:break-word}
  .sticky-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(14,87,78,.08);z-index:30;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
  .sticky-foot .in-wrap{max-width:880px;margin:0 auto;padding:0 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
  .sticky-foot .sum{flex:1;font-size:13px;color:var(--muted)}
  .auth-opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
  .auth-opt:hover{border-color:#cfc9bb}
  .auth-opt input{margin-top:3px;width:17px;height:17px;accent-color:var(--ink);flex:none}
  .auth-opt b{color:var(--ink)}
  .auth-opt .d{font-size:12.5px;color:var(--muted)}
  .auth-opt.dis{opacity:.55;cursor:not-allowed;background:#faf9f6}
  .obs-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .obs-row:last-child{border-bottom:0}
  .radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px}
  .radio input{margin-top:4px;accent-color:var(--ink)}
  .radio .d{font-size:12.5px;color:var(--muted)}
  .doclist{list-style:none;margin:0;padding:0}
  .doclist li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px}
  .doclist li:hover{background:#f7f5f0}
  .doclist li.on{background:var(--gold-soft)}
  .doclist li .ic{width:28px;height:28px;border-radius:7px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
  .evi{border:1px dashed #d6d0c2;border-radius:12px;padding:14px;margin-bottom:12px;background:#fcfbf8}
  .evi h4{margin:0 0 4px;font-size:15px;color:var(--ink)}
  .evi .d{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .evi .prev{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .evi .prev img{height:92px;border-radius:8px;border:1px solid var(--line);object-fit:cover;max-width:100%}
  .evi .ok{color:var(--ok);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .cam{position:relative;background:#111;border-radius:12px;overflow:hidden}
  .cam video{width:100%;display:block;max-height:340px;object-fit:cover;transform:scaleX(-1)}
  .doc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;            // só conteúdo estático (ícones)
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
// ignora valores vazios (false/null) passados a replaceChildren — evita aparecer "false" na tela
const _rc = Element.prototype.replaceChildren;

function toast(msg, err) {

}

async function api(action, payload = {}) {
  let res;
  try { res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }), redirect: 'follow' }); }
  catch (e) { throw new Error('Sem conexão com o servidor. Verifique sua internet e tente novamente.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Resposta inválida do servidor.'); }
  if (!j.ok) throw new Error(j.error || 'Erro inesperado.');
  return j.data;
}

async function busy(btn, fn, label) {
  const old = [...btn.childNodes];
  btn.disabled = true;
  btn.replaceChildren(h('span', { class: 'spinner' }), h('span', null, label || 'Aguarde…'));
  try { return await fn(); }
  catch (e) { toast(e.message, true); throw e; }
  finally { btn.disabled = false; btn.replaceChildren(...old); }
}

function getGeo() {

}

const b64ToBytes = (b64) => { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
const bytesToB64 = (u8) => { let s = ''; const ch = 0x8000; for (let i = 0; i < u8.length; i += ch) s += String.fromCharCode.apply(null, u8.subarray(i, i + ch)); return btoa(s); };
const fileToDataUrl = (f) => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(f); });
async function sha256(bytes) { const d = await crypto.subtle.digest('SHA-256', bytes); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }

function brt(iso) {
  if (!iso) return null;
  const d = new Date(new Date(iso).getTime() - 3 * 3600e3);
  const p = (n) => String(n).padStart(2, '0');
  return { d: `${p(d.getUTCDate())}/${p(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`, t: `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}` };
}

const fmtD = (iso) => { const b = brt(iso); return b ? b.d : '—'; };

function cpfValid(c) {
  c = digits(c);

  for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += (+c[i]) * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; }
  return true;
}

const fmtPhone = (p) => { const d = digits(p); if (d.length < 10) return d; return `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`; };
function maskInput(el, fn) { el.addEventListener('input', () => { el.value = fn(el.value); }); return el; }

function modal({ title, body, footer, wide, onClose, locked }) {
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc); onClose && onClose(); };
  const esc = (e) => { if (e.key === 'Escape' && !locked) close(); };
  const bodyEl = h('div', { class: 'modal-b' }, body);
  const footEl = h('div', { class: 'modal-f' }, footer || []);
  if (!footer) footEl.style.display = 'none';
  const titleEl = h('h2', null, title);
  const m = h('div', { class: 'modal' + (wide ? ' wide' : '') },
    h('div', { class: 'modal-h' }, titleEl, h('button', { class: 'x', html: I.x, title: 'Fechar', onclick: close })), bodyEl, footEl);
  const ov = h('div', { class: 'overlay', onmousedown: (e) => { if (e.target === ov && !locked) close(); } }, m);
  document.body.append(ov);
  document.addEventListener('keydown', esc);
  return {
    close, el: m,
    setBody: (...n) => bodyEl.replaceChildren(...n),
    setFooter: (...n) => { footEl.style.display = ''; footEl.replaceChildren(...n.filter(Boolean)); },
    setTitle: (t) => { titleEl.textContent = t; }
  };
}

/* ------------------------------------------------------------ conversões para PDF (no navegador) */
function wa(s) {
  return String(s ?? '').normalize('NFC').replace(/[‘’‚]/g, "'").replace(/[“”„]/g, '"')
    .replace(/[–—−]/g, '-').replace(/…/g, '...').replace(/[   ]/g, ' ')
    .replace(/\t/g, '    ').replace(/\r/g, '').replace(/[^\n\x20-\x7E\xA1-\xFF]/g, '?');
}
function loadImg(src) { return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('Imagem inválida.')); i.src = src; }); }
async function compressImage(fileOrUrl, max = 1600, q = 0.82) {
  const url = typeof fileOrUrl === 'string' ? fileOrUrl : URL.createObjectURL(fileOrUrl);
  const img = await loadImg(url);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = h('canvas', { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  if (typeof fileOrUrl !== 'string') URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', q);
}
async function imageToPdf(file) {
  const { PDFDocument } = await loadPdfLib();
  const jpg = b64ToBytes((await compressImage(file, 2200, 0.88)).split(',')[1]);
  const doc = await PDFDocument.create();
  const img = await doc.embedJpg(jpg);
  const land = img.width > img.height;
  const [W, H] = land ? [841.89, 595.28] : [595.28, 841.89];
  const m = 28, sc = Math.min((W - 2 * m) / img.width, (H - 2 * m) / img.height);
  doc.addPage([W, H]).drawImage(img, { x: (W - img.width * sc) / 2, y: (H - img.height * sc) / 2, width: img.width * sc, height: img.height * sc });
  return await doc.save();
}
async function textToPdf(file) {
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const W = 595.28, H = 841.89, M = 56, size = 10.5, lh = 15;
  const lines = [];
  for (const para of wa(await file.text()).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (font.widthOfTextAtSize(t, size) <= W - 2 * M) line = t; else { lines.push(line); line = word; }
    }
    lines.push(line);
  }
  let page = null, y = 0;
  for (const ln of lines) {
    if (!page || y < M) { page = doc.addPage([W, H]); y = H - M; }
    page.drawText(ln, { x: M, y: y - size, size, font, color: rgb(0.1, 0.1, 0.1) }); y -= lh;
  }
  if (!page) doc.addPage([W, H]);
  return await doc.save();
}
async function pdfInfo(bytes) {
  const { PDFDocument } = await loadPdfLib();
  try { const d = await PDFDocument.load(bytes); return { pages: d.getPageCount() }; }
  catch (e) { throw new Error(/encrypt/i.test(e.message) ? 'PDF protegido por senha não é aceito. Remova a proteção e envie novamente.' : 'Não foi possível ler este PDF.'); }
}

/* ------------------------------------------------------------ visualizador de PDF */
async function renderPdf(container, bytes) {
  container.replaceChildren(loadingView('Abrindo documento…'));
  try {
    const pdfjs = await loadPdfjs();
    const pdf = await pdfjs.getDocument({ data: bytes.slice() }).promise;
    container.replaceChildren();
    const io = new IntersectionObserver((entries) => {
      for (const en of entries) if (en.isIntersecting && !en.target._done) { en.target._done = true; draw(en.target); }
    }, { rootMargin: '600px 0px' });
    async function draw(el) {
      const page = await pdf.getPage(el._n);
      const vp1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (el.clientWidth / vp1.width) * Math.min(window.devicePixelRatio || 1, 2.5) });
      const c = h('canvas', { width: Math.floor(vp.width), height: Math.floor(vp.height) });
      await page.render({ canvas: c, canvasContext: c.getContext('2d'), viewport: vp }).promise;
      el.querySelector('.ph')?.remove(); el.prepend(c);
    }
    for (let n = 1; n <= pdf.numPages; n++) {
      const vp = (await pdf.getPage(n)).getViewport({ scale: 1 });
      const el = h('div', { class: 'pg' }, h('div', { class: 'ph', style: `aspect-ratio:${vp.width}/${vp.height}` }), h('span', { class: 'pn' }, `${n} / ${pdf.numPages}`));
      el._n = n; container.append(el); io.observe(el);
    }
  } catch (e) {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    container.replaceChildren(h('div', { class: 'card', style: 'padding:30px;text-align:center' },
      h('p', null, 'Não foi possível exibir o documento neste navegador.'),
      h('a', { class: 'btn btn-ink', href: url, target: '_blank', rel: 'noopener' }, 'Abrir PDF em nova aba')));
  }
}

function confirmCancel(id, parent) {
  const reason = h('textarea', { class: 'in', placeholder: 'Motivo (opcional, será informado aos signatários)' });
  const go = h('button', { class: 'btn btn-danger' }, 'Cancelar envelope');
  const c = modal({ title: 'Cancelar envelope?', body: [h('p', { style: 'margin-top:0' }, 'Os links de assinatura deixam de funcionar. Esta ação não pode ser desfeita.'), reason],
    footer: [h('button', { class: 'btn btn-ghost', onclick: () => c.close() }, 'Voltar'), go] });
  go.addEventListener('click', () => busy(go, async () => {
    await adminApi('cancel', { id, reason: reason.value.trim(), client: await clientInfo() });
    c.close(); parent.close(); toast('Envelope cancelado.'); renderDashboard();
  }).catch(() => {}));

async function renderSigner(token) {
  mount(topbar(null), h('main', { class: 'wrap' }, loadingView('Carregando documentos…')));
  let d;
  try { d = await api('signerOpen', { token, client: await clientInfo() }); }
  catch (e) {
    mount(topbar(null), h('main', { class: 'wrap' }, h('div', { class: 'center-screen', style: 'min-height:60vh' },
      h('div', { class: 'card', style: 'padding:30px;max-width:460px;text-align:center' }, h('h2', { style: 'margin-bottom:8px' }, 'Link indisponível'), h('p', { class: 'muted' }, e.message)))));
    return;
  }
  if (d.brand) { CONFIG.BRAND = d.brand; document.title = d.brand; }
  const env = d.env, me = d.me;
  for (const doc of d.documents) { doc.bytes = b64ToBytes(doc.pdfBase64); delete doc.pdfBase64; doc.seen = await sha256(doc.bytes); doc.intact = doc.seen === doc.hash; }
  const allIntact = d.documents.every(x => x.intact);
  const docHashes = Object.fromEntries(d.documents.map(x => [x.id, x.seen]));

  const dlFinal = (doc, btn) => busy(btn, async () => { const f = await api('getFile', { token, docId: doc.id, kind: 'final' }); download(b64ToBytes(f.pdfBase64), f.fileName); }).catch(() => {});
  const finals = () => h('div', { class: 'dl-list' }, d.documents.map(doc => h('button', { class: 'btn btn-ink btn-sm', style: 'justify-content:flex-start', onclick: (e) => dlFinal(doc, e.currentTarget) }, icon('dl'), doc.name + ' (assinado)')));

  let banner = null, bar = null;
  if (me.status === 'assinado') {
    banner = h('div', { class: 'alert ok' }, h('span', { html: I.check }), h('div', { style: 'flex:1' },
      h('b', null, 'Você assinou'), ' em ' + fmtDT(me.signedAt) + '. O comprovante foi enviado ao seu e-mail.',
      env.status === 'concluido' ? finals()
        : h('div', { class: 'small', style: 'margin-top:4px' }, env.status === 'finalizando' ? 'Todos assinaram. As vias finais estão sendo geradas e chegarão por e-mail.'
          : env.status === 'aguardando_finalizacao' ? 'Todos assinaram. Aguardando a finalização pelo remetente.' : 'Quando todos assinarem, você receberá as vias finais por e-mail.')));
  } else if (me.status === 'recusado') {
    banner = h('div', { class: 'alert bad' }, h('span', { html: I.info }), h('div', null, 'Você recusou a assinatura em ' + fmtDT(me.declinedAt) + '.'));
  } else if (env.status !== 'em_andamento') {
    const txt = { cancelado: 'Este envelope foi cancelado pelo remetente.', expirado: 'A data limite para assinatura terminou.', recusado: 'Este envelope foi recusado por um dos signatários e não pode mais ser assinado.' }[env.status] || 'Este envelope não está mais disponível para assinatura.';
    banner = h('div', { class: 'alert warn' }, h('span', { html: I.info }), h('div', null, txt));
  } else if (!d.canSign) {
    banner = h('div', { class: 'alert warn' }, h('span', { html: I.info }), h('div', null, 'Este envelope é assinado em ordem. Aguardando a assinatura de ', h('b', null, d.waitingFor || 'outro signatário'), '. Você receberá um e-mail quando for a sua vez.'));
  } else {
    bar = h('div', { class: 'actionbar' }, h('div', { class: 'wrap' },
      h('div', { class: 'tx' }, h('b', null, me.name), h('div', { class: 'small muted' }, `Assinando como ${me.roleLabel} · ${d.documents.length} documento(s)`)),
      h('button', { class: 'btn btn-ghost', onclick: () => openDecline(token) }, 'Recusar'),
      h('button', { class: 'btn btn-primary', disabled: !allIntact, onclick: () => openSignFlow(token, d, docHashes) }, icon('pen'), 'Assinar')));
  }

  const viewer = h('div', { class: 'viewer' });
  const tabs = h('div', { class: 'doc-tabs' });
  const docList = h('ul', { class: 'doclist' });
  let cur = 0;
  const show = (i) => {
    cur = i;
    tabs.replaceChildren(...(d.documents.length > 1 ? d.documents.map((x, j) => h('button', { class: j === cur ? 'on' : '', onclick: () => show(j) }, x.name)) : []));

      h('dl', { class: 'kv' },
        h('dt', null, 'Código'), h('dd', { class: 'mono' }, doc.code),
        h('dt', null, 'Envelope'), h('dd', null, env.name + (env.otherDocs.length ? ` (com mais ${env.otherDocs.length} documento(s))` : '')),
        h('dt', null, 'Criado em'), h('dd', null, fmtDT(env.createdAt) + (env.sender ? ' por ' + env.sender : '')),
        env.completedAt && h('dt', null, 'Concluído em'), env.completedAt && h('dd', null, fmtDT(env.completedAt)),
        h('dt', null, 'SHA-256 do original'), h('dd', { class: 'mono' }, doc.hash),
        doc.finalHash && h('dt', null, 'SHA-256 da via final'), doc.finalHash && h('dd', { class: 'mono' }, doc.finalHash)),
      h('div', { class: 'section-t' }, 'Signatários'),
      h('ul', { class: 'plist' }, d.signers.map(s => h('li', null, h('span', { class: 'dot ' + s.status }, initials(s.name)),
        h('div', { style: 'min-width:0' }, h('div', { style: 'font-weight:600' }, s.name),
          h('div', { class: 'small muted' }, `${s.roleLabel} · ${s.email}${s.cpf ? ' · CPF ' + s.cpf : ''}${s.signedAt ? ' · assinou em ' + fmtDT(s.signedAt) : ''}`),
          h('div', { class: 'small muted' }, 'Autenticação: ' + s.auths.join(', '))),
        h('span', { class: 'st' }, badge(SIG_ST, s.status))))),
      h('div', { class: 'section-t' }, 'Conferir um arquivo'),
      h('p', { class: 'small muted', style: 'margin:-4px 0 10px' }, 'Selecione o PDF que você recebeu para conferir se é idêntico ao registrado. A conferência é feita no seu navegador; o arquivo não é enviado a ninguém.'),
      h('button', { class: 'btn btn-ghost', onclick: () => fin.click() }, icon('upload'), 'Selecionar PDF'), fin, h('div', { style: 'margin-top:12px' }, fileRes),
      h('div', { class: 'section-t' }, 'Histórico'),
      h('div', { class: 'timeline' }, d.events.map(e => h('div', { class: 'ev ' + e.type }, h('div', { class: 'd' }, fmtDT(e.ts)), h('div', { class: 'tx' }, e.detail))))));
  }
  mount(topbar(null), h('main', { class: 'wrap' }, h('div', { class: 'verify-box' }, h('h1', null, 'Verificar documento'),
    h('p', { class: 'muted', style: 'margin:0 0 20px' }, 'Informe o código de verificação impresso nas páginas do documento assinado.'), form, out)));
  if (initial) run();
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
document.title = CONFIG.BRAND;
const qs = new URLSearchParams(location.search);
if (/COLE_AQUI/.test(CONFIG.API_URL)) {
  mount(h('div', { class: 'center-screen' }, h('div', { class: 'card', style: 'padding:30px;max-width:520px' },
    h('h2', { style: 'margin-bottom:8px' }, 'Configuração pendente'),
    h('p', { class: 'muted' }, 'Edite o arquivo index.html e cole em CONFIG.API_URL a URL do App da Web do Google Apps Script (ou do Worker).'))));
} else if (qs.get('t')) renderSigner(qs.get('t'));
else if (qs.has('v')) renderVerify(qs.get('v'));
else if (S.session) renderDashboard();
else renderLogin();
</script>
